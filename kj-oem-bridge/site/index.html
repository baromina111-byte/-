<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;

h1,h2,h3{font-family:"Noto Serif JP","Noto Serif KR",serif;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}

header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font-family:"Noto Serif JP",serif;letter-spacing:.2em;font-size:15px;text-decoration:none;white-space:nowrap}
.brand small{letter-spacing:.05em;color:var(--muted);font-size:11px;margin-left:6px}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{white-space:nowrap;border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
  padding:13px 26px;border-radius:2px;font-size:15px;letter-spacing:.04em;border:1px solid var(--accent);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep);border-color:var(--deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 16px;font-size:13px;white-space:nowrap}
html[data-lang="ko"] body{word-break:keep-all}

.hero{padding:88px 0 72px}
.hero h1{font-size:clamp(30px,5.4vw,54px);margin:18px 0 22px;max-width:16em}
.hero p.lead{font-size:clamp(16px,2vw,18px);color:var(--muted);max-width:36em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.note{font-size:13px;color:var(--muted);margin-top:14px}

section{padding:72px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(24px,3.4vw,34px);margin:12px 0 36px;max-width:20em}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);padding:28px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--muted);font-size:15px}
.num{font-family:"Noto Serif JP",serif;font-size:34px;color:var(--accent);line-height:1;margin-bottom:16px}

.dark{background:var(--deep);color:#efe9dc;border-top:0}
.dark .eyebrow{color:#c9a871}
.dark .card{background:transparent;border-color:#4a443a}
.dark .card p{color:#b9b1a2}
.tag{display:inline-block;font-size:12px;border:1px solid currentColor;padding:2px 10px;border-radius:999px;margin-bottom:14px;opacity:.85}

.price{display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding:18px 0}
.price:first-child{border-top:1px solid var(--line)}
.price b{font-weight:500}
.price span{color:var(--muted);font-size:14px;display:block}
.price em{font-style:normal;font-family:"Noto Serif JP",serif;font-size:20px;white-space:nowrap}

form{display:grid;gap:14px}
label{font-size:13px;color:var(--muted);display:grid;gap:6px}
input,select,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:120px;resize:vertical}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
#formMsg{font-size:14px;color:var(--accent);min-height:1.5em}

footer{padding:40px 0 60px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

  mfTitle:"한국 제조사 분들께",
  mfLead:"일본 브랜드의 문의를 일본어 대응까지 포함해 전달합니다. 등록은 무료이고 거래가 성사될 때만 수수료를 받습니다. 소량 생산이 가능한 공장을 우선 소개합니다.",
  mfCta:"등록 신청하기",
  ctTitle:"문의하기",
  fType:"구분", fTypeA:"일본 브랜드·판매 사업자", fTypeB:"한국 제조사",
  fCompany:"회사명·브랜드명", fName:"담당자명", fEmail:"이메일",
  fItem:"품목", i1:"향수", i2:"디퓨저", i3:"룸스프레이", i4:"캔들", i5:"헤어/바디 미스트", i6:"기타",

}};

let lang = "ja";
function setLang(l){
  lang = T[l] ? l : "ja";
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
  document.title = T[lang].title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n] ?? ""; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === lang)));
  document.getElementById("formMsg").textContent = "";
  try { localStorage.setItem("sb-lang", lang); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.set)));

let saved = null;
try { saved = localStorage.getItem("sb-lang"); } catch (e) {}
setLang(saved || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "ja"));

document.getElementById("inq").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, f = new FormData(form), msg = document.getElementById("formMsg"), t = T[lang];
  if (!f.get("company") || !f.get("name") || !/^\S+@\S+\.\S+$/.test(f.get("email") || "")) { msg.textContent = t.mNeed; return; }
  const sel = form.elements;
  const itemText = sel.namedItem("item").selectedOptions[0].textContent;
  const btn = form.querySelector("button[type=submit]"); btn.disabled = true; msg.textContent = t.mSending;
  try {
    const r = await fetch("/api/public/inquiry", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: f.get("type"), company: f.get("company"), name: f.get("name"), email: f.get("email"), item: itemText, qty: f.get("qty"), message: f.get("msg"), website: f.get("website"), lang }) });
    if (!r.ok) throw new Error(r.status);
    form.reset(); msg.textContent = t.mDone;
  } catch (er) {
    // 서버에 닿지 않으면 메일로 대신 보낸다
    const body = [t.fType + ": " + sel.namedItem("type").selectedOptions[0].textContent, t.fCompany + ": " + f.get("company"), t.fName + ": " + f.get("name"), t.fEmail + ": " + f.get("email"), t.fItem + ": " + itemText, t.fQty + ": " + (f.get("qty") || "-"), "", f.get("msg") || ""].join("\n");
    location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(t.subj) + "&body=" + encodeURIComponent(body);
    msg.textContent = t.mOpen;
  } finally { btn.disabled = false; }
});
fetch("/api/auth/me").then(r => r.json()).then(d => { if (d.user) { const a = document.getElementById("acct"); a.dataset.i18n = "navMy"; a.textContent = T[lang].navMy; if (d.user.role === "admin") a.href = "/admin"; } }).catch(() => {});
</script>
