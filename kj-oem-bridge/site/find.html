<style>
:root{--bg:#f6f2ea;--surface:#fffdf8;--ink:#1d1b18;--muted:#6b655c;--line:#ddd5c6;--accent:#7a5a2e;--accent-ink:#fffdf8;--deep:#23201b;--cos:#8a3b2e;--goods:#2f5d50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}

h1,h2,h3{font-family:"Noto Serif JP","Noto Serif KR",serif;font-weight:600;line-height:1.35;margin:0}
p{margin:0} a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:"Noto Serif JP",serif;letter-spacing:.2em;font-size:15px;text-decoration:none;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{white-space:nowrap;border:0;background:transparent;padding:5px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top{padding:36px 0 24px}
.top h1{font-size:clamp(24px,3.6vw,34px)}
.top p{color:var(--muted);margin-top:8px;max-width:44em}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:140px}
.filters{position:sticky;top:76px;display:flex;flex-direction:column;gap:20px;background:var(--surface);border:1px solid var(--line);padding:18px}
.filters h2{font-size:13px;font-family:inherit;font-weight:500;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.reset{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;text-align:left}
.count{font-size:14px;color:var(--muted);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cid{font-family:"Noto Serif JP",serif;font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cid small{font-family:inherit;font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.tag.cos{color:var(--cos)} .tag.goods{color:var(--goods)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
.pick{margin-top:auto;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:9px;cursor:pointer}
.card.on .pick{background:var(--ink);color:var(--bg)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.legend b{font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--deep);color:#efe9dc;border-top:1px solid #4a443a}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.bar .ids{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.bar .ids span.x{border:1px solid #8a8171;padding:2px 9px;border-radius:999px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);font:inherit;font-size:15px;padding:10px 22px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,18,15,.55)}
.dlg{padding:26px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:22px}
form{display:grid;gap:12px}
form label{font-size:13px;color:var(--muted);display:grid;gap:5px}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;padding:0;flex:none}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);font:inherit;padding:10px 18px;cursor:pointer}
#fmsg{font-size:14px;color:var(--accent);min-height:1.4em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)} .filters{position:static}}
</style>

add:"比較に追加",added:"選択中（外す）",full:"3社まで選択できます",pick0:"メーカーを選ぶと、ここに表示されます",ask:"選んだメーカーに見積依頼",
kGoods:"雑貨",kGoodsD:"日本では化粧品の許可なしで輸入できる品目",kCos:"化粧品",kCosD:"製造販売業許可を持つ事業者（輸入代行）が必要な品目",

add:"비교에 추가",added:"선택됨(빼기)",full:"3곳까지 고를 수 있습니다",pick0:"제조사를 고르면 여기에 표시됩니다",ask:"고른 제조사에 견적 요청",

disc:"※ 게재 내용은 각 회사가 공개한 정보를 바탕으로 한 조사 결과이며, 당사와의 제휴를 뜻하지 않습니다. 회사명은 견적 요청 시 안내합니다. 구분은 일반적인 기준이며 개별 제품은 성분과 표시에 따라 달라집니다.",
dTitle:"견적 요청",dSel:s=>`선택: ${s}`,qCo:"회사명·브랜드명",qNm:"담당자명",qEm:"이메일",qQty:"희망 수량(개)",qMsg:"품목·희망 사항(향, 용기, 납기 등)",cancel:"닫기",send:"보내기",
need:"회사명·담당자명·이메일을 입력해 주세요.",soon:"접수 창구를 준비하고 있습니다. 곧 시작합니다.",opened:"메일 프로그램이 열립니다. 그대로 보내 주세요. 열리지 않으면 baromina111@gmail.com 로 직접 보내 주세요.",subj:"[SCENT BRIDGE] 견적 요청"}};

const TAGS = window.SB_TAGS || [], MAKERS = window.SB_MAKERS || [];
const tagById = Object.fromEntries(TAGS.map(t => [t.id, t]));
let lang = "ja";
const st = { tags:new Set(), moq:"", gmp:false, jp:false, small:false, reg:false, picked:[] };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function match(m){
  if (st.tags.size && ![...st.tags].every(t => m.tags.includes(t))) return false;
  if (st.moq && !(m.moq != null && m.moq <= Number(st.moq))) return false;
  if (st.gmp && !m.certs.some(c => c === "ISO 22716" || c === "CGMP")) return false;
  if (st.jp && !m.japan) return false;
  if (st.reg && !m.registered) return false;
  if (st.small && m.large) return false;
  return true;
}
function render(){
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dataset.lang = lang; document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(e => { const v = t[e.dataset.i18n]; if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === lang)));
  const ft = $("fTags"); ft.replaceChildren();
  TAGS.forEach(tg => { const b = el("button","chip",tg[lang]); b.type = "button"; b.setAttribute("aria-pressed", String(st.tags.has(tg.id)));
    b.addEventListener("click", () => { st.tags.has(tg.id) ? st.tags.delete(tg.id) : st.tags.add(tg.id); render(); }); ft.appendChild(b); });
  const list = MAKERS.filter(match).sort((a,b) => (a.moq ?? 1e9) - (b.moq ?? 1e9));
  $("count").textContent = t.count(list.length);
  const box = $("cards"); box.replaceChildren();
  if (!list.length) box.appendChild(el("p","empty",t.none));
  list.forEach(m => {
    const on = st.picked.includes(m.id), c = el("article","card" + (on ? " on" : ""));
    const h = el("div","cid"); h.appendChild(el("span",null,m.id)); if (m.large) h.appendChild(el("small",null,t.large)); c.appendChild(h);
    const tg = el("div","tags"); m.tags.forEach(id => tg.appendChild(el("span","tag " + tagById[id].kind, tagById[id][lang]))); c.appendChild(tg);
    const dl = el("dl");
    [[t.moq, m.moq != null ? t.moqV(m.moq) : t.moqNo],[t.reg, m.region[lang]],[t.cert, m.certs.length ? m.certs.join(", ") : t.certNo],
     [t.regK, m.registered ? t.regV : t.regNo],[t.exp, m.japan ? t.expJp : m.export ? t.expYes : t.expNo],[t.chk, m.checked]].forEach(([k,v]) => { dl.appendChild(el("dt",null,k)); dl.appendChild(el("dd",null,v)); });
    c.appendChild(dl);
    const b = el("button","pick", on ? t.added : t.add); b.type = "button";
    if (!on && st.picked.length >= MAX) { b.disabled = true; b.title = t.full; }
    b.addEventListener("click", () => { on ? st.picked.splice(st.picked.indexOf(m.id),1) : st.picked.push(m.id); render(); });
    c.appendChild(b); box.appendChild(c);
  });
  const p = $("picked"); p.replaceChildren();
  if (!st.picked.length) p.appendChild(el("span",null,t.pick0)); else st.picked.forEach(id => p.appendChild(el("span","x",id)));
  $("open").disabled = !st.picked.length;
  $("dSel").textContent = t.dSel(st.picked.join(" / "));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.set; try { localStorage.setItem("sb-lang", lang); } catch(e){} render(); }));
$("fMoq").addEventListener("change", e => { st.moq = e.target.value; render(); });
[["fGmp","gmp"],["fJp","jp"],["fSmall","small"],["fReg","reg"]].forEach(([id,k]) => $(id).addEventListener("change", e => { st[k] = e.target.checked; render(); }));
$("reset").addEventListener("click", () => { st.tags.clear(); st.moq = ""; st.gmp = st.jp = st.small = st.reg = false; $("fMoq").value = ""; ["fGmp","fJp","fSmall","fReg"].forEach(i => $(i).checked = false); render(); });
$("open").addEventListener("click", () => { $("fmsg").textContent = ""; $("dlg").showModal(); });
$("close").addEventListener("click", () => $("dlg").close());
$("rq").addEventListener("submit", e => {
  e.preventDefault(); const t = T[lang], f = new FormData(e.target), msg = $("fmsg");
  if (!f.get("co") || !f.get("nm") || !/^\S+@\S+\.\S+$/.test(f.get("em") || "")) { msg.textContent = t.need; return; }
  if (!CONTACT_EMAIL) { msg.textContent = t.soon; return; }
  const body = ["Makers: " + st.picked.join(", "), t.qCo + ": " + f.get("co"), t.qNm + ": " + f.get("nm"), t.qEm + ": " + f.get("em"), t.qQty + ": " + (f.get("qty") || "-"), "", f.get("msg") || ""].join("\n");
  location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(t.subj) + "&body=" + encodeURIComponent(body);
  msg.textContent = t.opened;
