<head>
<meta charset="utf-8">

<title>SCENT BRIDGE | インフルエンサー連携</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#ECE6DA;--surface:#F4F0E8;--ink:#191714;--muted:#7A7266;--line:#C9BFAE;--accent:#9B4A2B;--accent-ink:#F4F0E8;--deep:#16140F;--ok:#2f5d50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-family:"Zen Kaku Gothic New","IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
html[data-lang="ko"] body{word-break:keep-all;font-family:"IBM Plex Sans KR","Zen Kaku Gothic New",system-ui,sans-serif}
html[data-lang="ko"] h1,html[data-lang="ko"] h2,html[data-lang="ko"] h3{font-family:"Gowun Batang","Shippori Mincho",serif}
h1,h2,h3{font-family:"Shippori Mincho","Gowun Batang",serif;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0} a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:"Shippori Mincho","Gowun Batang",serif;letter-spacing:.2em;font-size:15px;text-decoration:none;white-space:nowrap}
.nav-r{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{white-space:nowrap;border:0;background:transparent;padding:5px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);font:inherit;font-size:15px;padding:11px 22px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
.hero{padding:56px 0 36px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(26px,4.4vw,42px);margin:14px 0 16px;max-width:18em}
.hero p{color:var(--muted);max-width:42em}
.paths{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin:30px 0 12px}
.path{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:10px}
.path h2{font-size:20px}
.path p{color:var(--muted);font-size:14px}
.path ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.path .cta{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:8px}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);margin:18px 0 0}
section.list{padding:40px 0 140px;border-top:1px solid var(--line);margin-top:30px}
section.list h2{font-size:24px;margin-bottom:6px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start;margin-top:18px}
.filters{position:sticky;top:76px;display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);padding:16px}
.filters h3{font-size:13px;font-family:inherit;font-weight:500;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.count{font-size:14px;color:var(--muted);margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cid{font-family:"Shippori Mincho","Gowun Batang",serif;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cid small{font-family:inherit;font-size:12px;color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:3px;border:1px solid var(--line)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0}
.pick{margin-top:auto;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px;cursor:pointer}
.card.on .pick{background:var(--ink);color:var(--bg)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--deep);color:#efe9dc}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.bar .ids{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.bar .ids span.x{border:1px solid #8a8171;padding:2px 9px;border-radius:999px}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,18,15,.55)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:12px}
form{display:grid;gap:10px}
form label{font-size:13px;color:var(--muted);display:grid;gap:5px}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#fmsg{font-size:14px;color:var(--accent);min-height:1.4em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)} .filters{position:static}}
@media (max-width:520px){.nav .ghost{display:none}}
</style>
</head>

      </article>

  <section class="list" id="list">

</main>

<div class="bar"><div class="wrap">

    <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">

    <div class="acts"><button type="button" class="ghost" id="close" data-i18n="close"></button><button class="btn" type="submit" data-i18n="send"></button></div>
  </form>
</div></dialog>

const PLATS = ["instagram","tiktok","youtube","x","blog"], CATS = ["fragrance","beauty","lifestyle","fashion","interior"];
const ORDER = ["<1k","1k-10k","10k-50k","50k-100k","100k+"];
let lang = "ja", LIST = [], ME = null;
const st = { plat:new Set(), cat:new Set(), band:"", country:"", ver:false, picked:[] };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const t = () => T[lang];

function match(p){
  if (st.plat.size && !st.plat.has(p.platform)) return false;
  if (st.cat.size && ![...st.cat].some(c => p.categories.includes(c))) return false;
  if (st.band && ORDER.indexOf(p.band) < ORDER.indexOf(st.band)) return false;
  if (st.country && p.country !== st.country) return false;
  if (st.ver && !p.verified) return false;
  return true;
}
function chips(box, values, set, labels){
  box.replaceChildren(...values.map(v => { const b = el("button", "chip", labels[v]); b.type = "button"; b.setAttribute("aria-pressed", String(set.has(v))); b.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); render(); }; return b; }));
}
function render(){
  const L = t();
  document.documentElement.lang = lang; document.documentElement.dataset.lang = lang; document.title = L.title;
  document.querySelectorAll("[data-i18n]").forEach(e => { const v = L[e.dataset.i18n]; if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === lang)));
  chips($("fPlat"), PLATS, st.plat, L.plat); chips($("fCat"), CATS, st.cat, L.cat);
  const list = LIST.filter(match).sort((a, b) => ORDER.indexOf(b.band) - ORDER.indexOf(a.band));
  $("count").textContent = L.count(list.length);
  const box = $("cards"); box.replaceChildren();
  if (!list.length) box.append(el("p", "empty", L.none));
  list.forEach(p => {
    const on = st.picked.includes(p.id), c = el("article", "card" + (on ? " on" : ""));
    const h = el("div", "cid"); h.append(el("span", null, p.id)); if (p.verified) h.append(el("small", null, "✓ " + L.ver)); c.append(h);
    const tg = el("div", "tags"); p.categories.forEach(x => tg.append(el("span", "tag", L.cat[x] || x))); c.append(tg);
    const dl = el("dl");
    [[L.dPlat, L.plat[p.platform] || p.platform], [L.dBand, L.band[p.band]], [L.dCountry, p.country === "KR" ? L.kr : p.country === "JP" ? L.jp : "-"]].forEach(([k, v]) => { dl.append(el("dt", null, k), el("dd", null, v)); });
    c.append(dl);
    if (p.interests.length) c.append(el("p", null, p.interests.map(i => L.int[i]).join(" · ")));
    const b = el("button", "pick", on ? L.added : L.add); b.type = "button";
    if (!on && st.picked.length >= MAX) b.disabled = true;
    b.onclick = () => { on ? st.picked.splice(st.picked.indexOf(p.id), 1) : st.picked.push(p.id); render(); };
    c.append(b); box.append(c);
  });
  const pk = $("picked"); pk.replaceChildren();
  if (!st.picked.length) pk.append(el("span", null, L.pick0)); else st.picked.forEach(id => pk.append(el("span", "x", id)));
  $("dSel").textContent = L.dSel(st.picked.join(" / "));
  if (ME) { const a = $("acct"); a.textContent = L.my; }
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.set; try { localStorage.setItem("sb-lang", lang); } catch (e) {} render(); });
$("fBand").onchange = e => { st.band = e.target.value; render(); };
$("fCountry").onchange = e => { st.country = e.target.value; render(); };
$("fVer").onchange = e => { st.ver = e.target.checked; render(); };
$("open").onclick = () => { $("fmsg").textContent = ""; $("dlg").showModal(); };
$("close").onclick = () => $("dlg").close();
$("cf").addEventListener("submit", async e => {
  e.preventDefault(); const L = t(), f = new FormData(e.target), msg = $("fmsg");
  if (!f.get("company") || !f.get("name") || !/^\S+@\S+\.\S+$/.test(f.get("email") || "") || !f.get("product")) { msg.textContent = L.need; return; }
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; msg.textContent = L.sending;
  try {
    const r = await fetch("/api/public/collab", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...Object.fromEntries(f), picks: st.picked, lang }) });
    if (!r.ok) throw new Error(r.status);
    msg.textContent = ME ? L.doneMember : L.done; st.picked = []; render();
  } catch (er) { msg.textContent = L.fail; } finally { btn.disabled = false; }
});
let saved = null; try { saved = localStorage.getItem("sb-lang"); } catch (e) {}
lang = saved || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "ja"); if (!T[lang]) lang = "ja";
render();
fetch("/api/public/influencers").then(r => r.ok ? r.json() : null).then(d => { if (d) { LIST = d.influencers; render(); } }).catch(() => {});
fetch("/api/auth/me").then(r => r.json()).then(d => { ME = d.user; if (ME) { const a = $("acct"); a.textContent = t().my; if (ME.role === "admin") a.href = "/admin"; $("c-co").value = ME.company || ""; $("c-nm").value = ME.name || ""; $("c-em").value = ME.email || ""; } }).catch(() => {});
</script>
</body>
</html>
