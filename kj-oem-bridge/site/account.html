<!doctype html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCENT BRIDGE | マイページ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--surface:#fffdf8;--ink:#1d1b18;--muted:#6b655c;--line:#ddd5c6;--accent:#7a5a2e;--accent-ink:#fffdf8;--deep:#23201b;--ok:#2f5d50;--warn:#8a3b2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
html[data-lang="ko"] body{word-break:keep-all}
h1,h2,h3{font-family:"Noto Serif JP",serif;font-weight:600;line-height:1.35;margin:0}
p{margin:0} a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:"Noto Serif JP",serif;letter-spacing:.2em;font-size:15px;text-decoration:none;white-space:nowrap}
.nav-r{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{padding:36px 0 80px}
.card{background:var(--surface);border:1px solid var(--line);padding:24px}
.auth{max-width:440px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;font:inherit;padding:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
form{display:grid;gap:12px}
label{font-size:13px;color:var(--muted);display:grid;gap:5px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;border-radius:2px}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);font:inherit;font-size:15px;padding:10px 22px;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);font:inherit;padding:8px 16px;cursor:pointer;border-radius:2px;font-size:14px;white-space:nowrap}
.msg{font-size:14px;color:var(--warn);min-height:1.4em}
.msg.ok{color:var(--ok)}
.radio{display:flex;gap:16px;flex-wrap:wrap}
.radio label{flex-direction:row;display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px}
.radio input{width:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head p{color:var(--muted);font-size:14px}
.sub{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:transparent;font:inherit;font-size:14px;padding:7px 14px;cursor:pointer;border-radius:999px}
.sub button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:14px}
.req h3{font-size:17px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.st{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;border:1px solid currentColor;color:var(--accent)}
.st.won{color:var(--ok)} .st.lost{color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin:6px 0 12px}
.steps{display:flex;gap:4px;margin:10px 0 14px}
.steps span{flex:1;height:4px;background:var(--line);border-radius:2px}
.steps span.on{background:var(--accent)}
.thread{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:grid;gap:8px}
.bubble{padding:10px 12px;border-radius:4px;font-size:14px;white-space:pre-wrap;max-width:85%}
.bubble.me{background:#efe6d4;justify-self:end}
.bubble.them{background:var(--bg);border:1px solid var(--line)}
.bubble small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.quotes{display:grid;gap:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.reply{display:flex;gap:8px;margin-top:6px}
.reply textarea{min-height:44px}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="/">SCENT BRIDGE</a>
  <div class="nav-r">
    <a class="ghost" href="/find" data-i18n="find" style="text-decoration:none"></a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-set="ja" aria-pressed="true">日本語</button><button type="button" data-set="ko" aria-pressed="false">한국어</button></div>
  </div>
</div></header>

<main class="wrap">
  <!-- 로그인 / 가입 -->
  <section id="authBox" class="auth card" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tLogin" aria-selected="true" data-i18n="login"></button>
      <button type="button" role="tab" id="tSignup" aria-selected="false" data-i18n="signup"></button>
    </div>
    <form id="fLogin" novalidate>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="msg" id="mLogin" role="status"></p>
      <button class="btn" type="submit" data-i18n="login"></button>
    </form>
    <form id="fSignup" novalidate hidden>
      <div class="radio" role="radiogroup">
        <label><input type="radio" name="role" value="brand" checked><span data-i18n="roleBrand"></span></label>
        <label><input type="radio" name="role" value="maker"><span data-i18n="roleMaker"></span></label>
      </div>
      <label><span data-i18n="company"></span><input name="company" autocomplete="organization" required></label>
      <label><span data-i18n="name"></span><input name="name" autocomplete="name" required></label>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email" required></label>
      <label><span data-i18n="pwNew"></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label><span data-i18n="country"></span><select name="country"><option value="JP" data-i18n="jp"></option><option value="KR" data-i18n="kr"></option><option value="ETC" data-i18n="etc"></option></select></label>
      <label style="flex-direction:row;display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" name="agree" style="width:auto;margin-top:5px"><span data-i18n="agree"></span></label>
      <p class="msg" id="mSignup" role="status"></p>
      <button class="btn" type="submit" data-i18n="signupBtn"></button>
    </form>
  </section>

  <!-- 로그인 후 -->
  <section id="appBox" hidden>
    <div class="head">
      <div><h1 id="hello"></h1><p id="who"></p></div>
      <button type="button" class="ghost" id="logout" data-i18n="logout"></button>
    </div>
    <div class="sub" id="subnav">
      <button type="button" data-v="reqs" aria-pressed="true" data-i18n="myReqs"></button>
      <button type="button" data-v="profile" aria-pressed="false" data-i18n="profile"></button>
    </div>
    <div id="vReqs"></div>
    <div id="vProfile" class="grid2" hidden>
      <form class="card" id="fProfile">
        <h3 data-i18n="profile"></h3>
        <label><span data-i18n="company"></span><input name="company"></label>
        <label><span data-i18n="name"></span><input name="name"></label>
        <label><span data-i18n="email"></span><input name="email" disabled></label>
        <p class="msg" id="mProfile" role="status"></p>
        <button class="btn" type="submit" data-i18n="save"></button>
      </form>
      <form class="card" id="fPw">
        <h3 data-i18n="pwChange"></h3>
        <label><span data-i18n="pwCur"></span><input name="current" type="password" autocomplete="current-password"></label>
        <label><span data-i18n="pwNew"></span><input name="next" type="password" autocomplete="new-password" minlength="8"></label>
        <p class="msg" id="mPw" role="status"></p>
        <button class="btn" type="submit" data-i18n="save"></button>
      </form>
    </div>
  </section>
</main>

<script src="/sb.js"></script>
<script>
const T = {
ja:{title:"SCENT BRIDGE | マイページ",find:"メーカーを探す",login:"ログイン",signup:"新規登録",signupBtn:"登録する",email:"メールアドレス",password:"パスワード",pwNew:"パスワード（8文字以上）",pwCur:"現在のパスワード",pwChange:"パスワード変更",
roleBrand:"日本のブランド・販売事業者",roleMaker:"韓国のメーカー",company:"会社名・ブランド名",name:"ご担当者名",country:"国・地域",jp:"日本",kr:"韓国",etc:"その他",
agree:"入力した情報を、マッチングのご連絡と見積のやり取りに使うことに同意します。",logout:"ログアウト",myReqs:"見積依頼",profile:"アカウント情報",save:"保存する",saved:"保存しました。",
hello:n=>`${n} 様`,makerReqs:"届いた依頼",
none:"まだ見積依頼はありません。",noneCta:"メーカーを探して依頼する",
st:{new:"受付",reviewing:"確認中",matched:"メーカー打診中",quoted:"見積あり",sample:"サンプル進行中",won:"成約",lost:"終了"},
picks:"選んだメーカー",qty:"数量",item:"品目",sent:"送信日",
quotes:"届いた見積",qPrice:"単価",qMoq:"最小ロット",qLead:"納期",qNote:"備考",
thread:"メッセージ",you:"あなた",staff:"SCENT BRIDGE",replyPh:"メッセージを入力",send:"送信",
err:{bad_credentials:"メールアドレスまたはパスワードが違います。",email_taken:"このメールアドレスは登録済みです。",weak_password:"パスワードは8文字以上にしてください。",invalid_email:"メールアドレスの形式をご確認ください。",missing_fields:"必須項目をご入力ください。",bad_current:"現在のパスワードが違います。",too_many_attempts:"試行回数が多すぎます。10分後にお試しください。",network:"通信できませんでした。時間をおいてお試しください。",agree:"同意にチェックしてください。",default:"エラーが発生しました。"},
notLinked:"メーカーアカウントの確認中です。運営が貴社の登録情報と紐づけると、日本のブランドからの依頼がここに届きます。",
mk:{country:"依頼元",myQuote:"提出した見積",submitQuote:"見積を提出",submitted:"提出しました。"}},
ko:{title:"SCENT BRIDGE | 마이페이지",find:"제조사 찾기",login:"로그인",signup:"회원가입",signupBtn:"가입하기",email:"이메일",password:"비밀번호",pwNew:"비밀번호 (8자 이상)",pwCur:"현재 비밀번호",pwChange:"비밀번호 변경",
roleBrand:"일본 브랜드·판매 사업자",roleMaker:"한국 제조사",company:"회사명·브랜드명",name:"담당자명",country:"국가",jp:"일본",kr:"한국",etc:"기타",
agree:"입력한 정보를 매칭 연락과 견적 협의에 사용하는 데 동의합니다.",logout:"로그아웃",myReqs:"견적 요청",profile:"계정 정보",save:"저장",saved:"저장했습니다.",
hello:n=>`${n} 님`,makerReqs:"받은 의뢰",
none:"아직 견적 요청이 없습니다.",noneCta:"제조사를 찾아 요청하기",
st:{new:"접수",reviewing:"검토 중",matched:"제조사 타진 중",quoted:"견적 도착",sample:"샘플 진행",won:"성사",lost:"종료"},
picks:"고른 제조사",qty:"수량",item:"품목",sent:"요청일",
quotes:"받은 견적",qPrice:"단가",qMoq:"최소 수량",qLead:"납기",qNote:"비고",
thread:"메시지",you:"나",staff:"SCENT BRIDGE",replyPh:"메시지 입력",send:"보내기",
err:{bad_credentials:"이메일 또는 비밀번호가 틀렸습니다.",email_taken:"이미 가입된 이메일입니다.",weak_password:"비밀번호는 8자 이상이어야 합니다.",invalid_email:"이메일 형식을 확인해 주세요.",missing_fields:"필수 항목을 입력해 주세요.",bad_current:"현재 비밀번호가 틀렸습니다.",too_many_attempts:"시도가 너무 많습니다. 10분 뒤에 다시 해 주세요.",network:"연결되지 않았습니다. 잠시 뒤 다시 해 주세요.",agree:"동의에 체크해 주세요.",default:"오류가 발생했습니다."},
notLinked:"제조사 계정을 확인하고 있습니다. 운영팀이 귀사 정보와 연결하면 일본 브랜드의 의뢰가 여기로 들어옵니다.",
mk:{country:"의뢰 국가",myQuote:"제출한 견적",submitQuote:"견적 제출",submitted:"제출했습니다."}}};
const ORDER = ["new","reviewing","matched","quoted","sample","won"];
const { api, me, el, fmt } = SB;
const $ = id => document.getElementById(id);
let lang = "ja", user = null, view = "reqs";
const t = () => T[lang];
const errText = e => t().err[e.message] || t().err[e.code === 0 ? "network" : "default"] || t().err.default;

function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dataset.lang = lang; document.title = t().title;
  document.querySelectorAll("[data-i18n]").forEach(e => { const v = t()[e.dataset.i18n]; if (typeof v === "string") e.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === lang)));
  if (user) renderApp();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.set; try { localStorage.setItem("sb-lang", lang); } catch(e){} applyLang(); }));

function tab(which){
  $("tLogin").setAttribute("aria-selected", String(which === "login")); $("tSignup").setAttribute("aria-selected", String(which === "signup"));
  $("fLogin").hidden = which !== "login"; $("fSignup").hidden = which !== "signup";
}
$("tLogin").onclick = () => tab("login"); $("tSignup").onclick = () => tab("signup");

async function busy(form, fn){ const b = form.querySelector("button[type=submit]"); b.disabled = true; try { await fn(); } finally { b.disabled = false; } }

$("fLogin").addEventListener("submit", e => { e.preventDefault(); const f = new FormData(e.target);
  busy(e.target, async () => { try { const d = await api("auth/login", { body: { email: f.get("email"), password: f.get("password") } }); user = d.user; show(); } catch (er) { $("mLogin").textContent = errText(er); } }); });

$("fSignup").addEventListener("submit", e => { e.preventDefault(); const f = new FormData(e.target), m = $("mSignup");
  if (!f.get("agree")) { m.textContent = t().err.agree; return; }
  busy(e.target, async () => { try { const d = await api("auth/signup", { body: { role: f.get("role"), company: f.get("company"), name: f.get("name"), email: f.get("email"), password: f.get("password"), country: f.get("country"), lang } }); user = d.user; show(); } catch (er) { m.textContent = errText(er); } }); });

$("logout").onclick = async () => { await api("auth/logout", { method: "POST" }).catch(() => {}); user = null; show(); };

document.querySelectorAll("#subnav button").forEach(b => b.onclick = () => { view = b.dataset.v; renderApp(); });

$("fProfile").addEventListener("submit", e => { e.preventDefault(); const f = new FormData(e.target);
  busy(e.target, async () => { try { const d = await api("auth/profile", { body: { company: f.get("company"), name: f.get("name"), lang } }); user = d.user; $("mProfile").className = "msg ok"; $("mProfile").textContent = t().saved; renderHead(); } catch (er) { $("mProfile").className = "msg"; $("mProfile").textContent = errText(er); } }); });
$("fPw").addEventListener("submit", e => { e.preventDefault(); const f = new FormData(e.target);
  busy(e.target, async () => { try { await api("auth/password", { body: { current: f.get("current"), next: f.get("next") } }); e.target.reset(); $("mPw").className = "msg ok"; $("mPw").textContent = t().saved; } catch (er) { $("mPw").className = "msg"; $("mPw").textContent = errText(er); } }); });

function renderHead(){
  $("hello").textContent = t().hello(user.name || user.email);
  $("who").textContent = `${user.company} · ${user.email}`;
}

function thread(messages, mine, onSend){
  const box = el("div", { class: "thread" }, el("b", { style: "font-size:13px;font-weight:500;color:var(--muted)" }, t().thread));
  messages.forEach(m => box.append(el("div", { class: "bubble " + (m.from === mine ? "me" : "them") }, m.text, el("small", null, (m.from === mine ? t().you : t().staff) + " · " + fmt(m.at)))));
  const ta = el("textarea", { placeholder: t().replyPh, "aria-label": t().replyPh });
  const btn = el("button", { class: "ghost", type: "button" }, t().send);
  btn.onclick = async () => { const v = ta.value.trim(); if (!v) return; btn.disabled = true; try { await onSend(v); await renderApp(); } catch (er) { alert(errText(er)); } finally { btn.disabled = false; } };
  box.append(el("div", { class: "reply" }, ta, btn));
  return box;
}

async function renderBrand(box){
  const d = await api("me/requests");
  if (!d.requests.length) { box.append(el("div", { class: "empty" }, el("p", null, t().none), el("p", { style: "margin-top:14px" }, el("a", { class: "btn", href: "/find" }, t().noneCta)))); return; }
  const list = el("div", { class: "list" });
  d.requests.forEach(r => {
    const idx = ORDER.indexOf(r.status);
    const steps = el("div", { class: "steps", "aria-hidden": "true" }, ORDER.map((s, i) => el("span", { class: i <= idx ? "on" : "" })));
    const c = el("article", { class: "card req" },
      el("h3", null, el("span", null, (r.item || r.picks.join(" / ") || r.id)), el("span", { class: "st " + r.status }, t().st[r.status] || r.status)),
      el("p", { class: "meta" }, `${t().sent}: ${fmt(r.createdAt)} · ${t().picks}: ${r.picks.join(", ") || "-"} · ${t().qty}: ${r.qty || "-"}`),
      r.status !== "lost" ? steps : null,
      r.message ? el("p", { style: "white-space:pre-wrap;font-size:14px" }, r.message) : null);
    if (r.quotes.length) {
      const tb = el("table", null, el("tr", null, ["", t().qPrice, t().qMoq, t().qLead, t().qNote].map(h => el("th", null, h))));
      r.quotes.forEach(q => tb.append(el("tr", null, [q.makerId, q.price, q.moq, q.lead, q.note].map(v => el("td", null, v || "-")))));
      c.append(el("div", { class: "quotes" }, el("b", { style: "font-size:13px;font-weight:500;color:var(--muted)" }, t().quotes), tb));
    }
    c.append(thread(r.messages, "brand", text => api(`me/requests/${r.id}/message`, { body: { text } })));
    list.append(c);
  });
  box.append(list);
}

async function renderMaker(box){
  const d = await api("maker/requests");
  if (!d.linked) { box.append(el("div", { class: "empty" }, t().notLinked)); return; }
  if (!d.requests.length) { box.append(el("div", { class: "empty" }, t().none)); return; }
  const list = el("div", { class: "list" });
  d.requests.forEach(r => {
    const c = el("article", { class: "card req" },
      el("h3", null, el("span", null, r.item || r.id), el("span", { class: "st " + r.status }, t().st[r.status] || r.status)),
      el("p", { class: "meta" }, `${t().sent}: ${fmt(r.createdAt)} · ${t().mk.country}: ${r.country || "JP"} · ${t().qty}: ${r.qty || "-"}`),
      r.message ? el("p", { style: "white-space:pre-wrap;font-size:14px" }, r.message) : null);
    const q = r.myQuote || {};
    const f = el("form", { class: "grid2", style: "margin-top:14px" },
      el("label", null, t().qPrice, el("input", { name: "price", value: q.price || "", placeholder: "₩3,500 / ¥390" })),
      el("label", null, t().qMoq, el("input", { name: "moq", value: q.moq || "" })),
      el("label", null, t().qLead, el("input", { name: "lead", value: q.lead || "" })),
      el("label", null, t().qNote, el("input", { name: "note", value: q.note || "" })));
    const m = el("p", { class: "msg ok" });
    const sb = el("button", { class: "btn", type: "button" }, t().mk.submitQuote);
    sb.onclick = async () => { const fd = new FormData(f); sb.disabled = true; try { await api(`maker/requests/${r.id}/quote`, { body: Object.fromEntries(fd) }); m.textContent = t().mk.submitted; } catch (er) { m.className = "msg"; m.textContent = errText(er); } finally { sb.disabled = false; } };
    c.append(el("b", { style: "font-size:13px;font-weight:500;color:var(--muted);display:block;margin-top:12px" }, r.myQuote ? t().mk.myQuote : t().mk.submitQuote), f, el("div", { style: "margin-top:10px;display:flex;gap:12px;align-items:center" }, sb, m));
    c.append(thread(r.messages, "maker", text => api(`maker/requests/${r.id}/message`, { body: { text } })));
    list.append(c);
  });
  box.append(list);
}

async function renderApp(){
  renderHead();
  document.querySelector('#subnav [data-v="reqs"]').textContent = user.role === "maker" ? t().makerReqs : t().myReqs;
  document.querySelectorAll("#subnav button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === view)));
  $("vReqs").hidden = view !== "reqs"; $("vProfile").hidden = view !== "profile";
  if (view === "profile") { const f = $("fProfile"); f.company.value = user.company || ""; f.name.value = user.name || ""; f.email.value = user.email; return; }
  const box = $("vReqs"); box.replaceChildren();
  try { await (user.role === "maker" ? renderMaker(box) : renderBrand(box)); } catch (er) { if (er.code === 401) { user = null; show(); } else box.append(el("p", { class: "msg" }, errText(er))); }
}

function show(){
  $("authBox").hidden = !!user; $("appBox").hidden = !user;
  if (user && user.role === "admin") { location.href = "/admin"; return; }
  if (user) renderApp();
}

let saved = null; try { saved = localStorage.getItem("sb-lang"); } catch(e){}
lang = saved || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "ja"); if (!T[lang]) lang = "ja";
if (location.hash === "#signup") tab("signup");
applyLang();
me().then(u => { user = u; show(); });
</script>
</body>
